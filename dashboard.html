<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WA Archive — Analytics</title><link rel="stylesheet" href="/src/ui.css"></head><body><main class="dashboard"><header><div><h1>WA Archive</h1><p>Analytics local das suas conversas</p></div><div class="header-actions"><button id="import">Importar conversa</button><button id="export">Exportar JSON</button><input id="import-file" type="file" accept=".txt,.zip,text/plain,application/zip" hidden></div></header><section class="toolbar"><input id="search" type="search" placeholder="Pesquisar mensagens, pessoas ou conversas…"><select id="conversation"><option value="">Todas as conversas</option></select><select id="period"><option value="0">Todo o histórico</option><option value="7">7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option></select></section><section id="metrics" class="metrics"></section><section id="dynamics" class="metrics"></section><section class="analytics-grid"><article class="panel"><h2>Atividade por horário</h2><div id="hours" class="bars"></div></article><article class="panel"><h2>Participantes</h2><div id="participants" class="ranking"></div></article></section><section class="panel"><h2>Atividade por dia</h2><div id="days" class="day-chart"></div></section><section><h2>Conversas</h2><div id="conversations" class="cards"></div></section><section class="panel"><div class="section-title"><div><h2>Mapa de conexões</h2><p>Clique em uma pessoa para isolar suas relações.</p></div><span id="reciprocity"></span></div><div id="network" class="network"></div><button id="clear-node" class="secondary graph-reset" hidden>Mostrar toda a rede</button><div id="connections" class="connections"></div></section><section class="panel"><div class="section-title"><h2>Timeline</h2><span id="result-count"></span></div><div id="timeline" class="timeline"></div></section><p class="privacy-note">Seus arquivos e mensagens são processados somente neste navegador.</p></main><dialog id="import-dialog"><h2>Importar conversa</h2><p id="import-summary"></p><select id="import-chat"></select><select id="import-owner"><option value="">Qual participante é você?</option></select><div class="dialog-actions"><button id="cancel-import" class="secondary">Cancelar</button><button id="confirm-import">Importar</button></div></dialog><script type="module" src="/src/dashboard.ts"></script></body></html>
